<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMARC Checker | Example I/O</title>
    <meta name="description" content="Kiểm tra bản ghi DMARC cho tên miền, xác thực email và gợi ý cấu hình chính sách DMARC.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238ab4f8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12h18M3 6h18M3 18h18'></path><rect x='2' y='4' width='20' height='16' rx='2'></rect></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/style.css?v=2">
    <style>
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin: 0 auto;
            text-align: left;
        }

        h2 {
            margin-bottom: 12px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            margin: 0;
            padding: 12px 16px;
            min-height: 48px;
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff;
            font-family: var(--font-primary);
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: none !important;
            opacity: 1 !important;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color) !important;
            background: rgba(255, 255, 255, 0.10) !important;
            box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.12) !important;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.32) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.32);
        }

        .form-group input::-webkit-input-placeholder {
            color: rgba(255, 255, 255, 0.32) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.32);
        }

        .form-group input::-moz-placeholder {
            color: rgba(255, 255, 255, 0.32) !important;
            opacity: 1 !important;
        }

        .btn-primary {
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading-state,
        .empty-state,
        .result-section {
            margin-top: 24px;
            text-align: left;
        }

        .loading-state,
        .empty-state {
            display: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            border: 1px solid rgba(138, 180, 248, 0.18);
            background: rgba(138, 180, 248, 0.08);
            color: var(--text-secondary);
        }

        .loading-state.active,
        .empty-state.active {
            display: block;
        }

        .result-section {
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .result-section h3,
        .result-section h4,
        .result-section p,
        .result-section li,
        .result-section ol {
            text-align: left;
        }

        .status {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.10);
            color: #81c995;
            border: 1px solid rgba(76, 175, 80, 0.25);
        }

        .status.error {
            background: rgba(244, 67, 54, 0.10);
            color: #f28b82;
            border: 1px solid rgba(244, 67, 54, 0.25);
        }

        .status.info {
            background: rgba(138, 180, 248, 0.10);
            color: #8ab4f8;
            border: 1px solid rgba(138, 180, 248, 0.25);
        }

        .status-icon {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .result-box,
        .dmarc-example {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 14px 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #ffffff;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-x: auto;
            text-align: left;
        }

        .result-box {
            margin-bottom: 16px;
        }

        .dmarc-details,
        .generate-section {
            margin-top: 16px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
        }

        .dmarc-details h4,
        .generate-section h4 {
            margin-bottom: 10px;
            color: var(--text-color);
            font-size: 0.98rem;
        }

        .dmarc-details p,
        .generate-section p,
        .generate-section li {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .generate-section ol {
            margin-top: 12px;
            padding-left: 20px;
        }

        .generate-section code {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 2px 6px;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="https://example.io.vn/" class="logo" aria-label="Về trang chủ">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
        </a>
    </header>

    <main class="main-content">
        <div class="container">
            <h2 class="hero-title" style="font-size: 2.5rem;">Trình kiểm tra DMARC</h2>
            <p class="subtitle">Kiểm tra bản ghi DMARC cho tên miền</p>

            <form id="dmarc-form">
                <div class="form-group">
                    <label for="domain">Tên miền</label>
                    <input type="text" id="domain" name="domain" placeholder="example.io.vn" autocomplete="off" spellcheck="false" required>
                </div>

                <button type="submit" class="btn-primary" id="checkBtn">Kiểm tra DMARC</button>
            </form>

            <div id="loadingState" class="loading-state">⏳ Đang kiểm tra DMARC...</div>
            <div id="emptyState" class="empty-state">Chưa có kết quả để hiển thị.</div>

            <div id="resultSection" class="result-section">
                <div id="statusBox"></div>
                <div id="resultContent"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Contact Example I/O Support Teams: <a href="mailto:support@example.io.vn">support@example.io.vn</a></p>
    </footer>

    <script>
        const form = document.getElementById('dmarc-form');
        const domainInput = document.getElementById('domain');
        const checkBtn = document.getElementById('checkBtn');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const resultSection = document.getElementById('resultSection');
        const statusBox = document.getElementById('statusBox');
        const resultContent = document.getElementById('resultContent');

        function normalizeDomain(value) {
            return value
                .trim()
                .replace(/^https?:\/\//i, '')
                .replace(/^www\./i, '')
                .replace(/\/.*$/, '')
                .replace(/\.$/, '')
                .toLowerCase();
        }

        function resetStates() {
            loadingState.classList.remove('active');
            emptyState.classList.remove('active');
            resultSection.classList.remove('active');
        }

        function showLoading() {
            resetStates();
            loadingState.classList.add('active');
            checkBtn.disabled = true;
            checkBtn.textContent = 'Đang kiểm tra...';
        }

        function showEmpty(message = 'Chưa có kết quả để hiển thị.') {
            resetStates();
            emptyState.textContent = message;
            emptyState.classList.add('active');
            checkBtn.disabled = false;
            checkBtn.textContent = 'Kiểm tra DMARC';
        }

        function showResult() {
            resetStates();
            resultSection.classList.add('active');
            checkBtn.disabled = false;
            checkBtn.textContent = 'Kiểm tra DMARC';
        }

        domainInput.addEventListener('paste', () => {
            requestAnimationFrame(() => {
                domainInput.value = normalizeDomain(domainInput.value);
            });
        });

        domainInput.addEventListener('blur', () => {
            domainInput.value = normalizeDomain(domainInput.value);
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            const domain = normalizeDomain(domainInput.value);
            domainInput.value = domain;

            if (!domain) {
                showEmpty('Vui lòng nhập tên miền cần kiểm tra.');
                return;
            }

            showLoading();

            try {
                const response = await fetch('check.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'domain=' + encodeURIComponent(domain)
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                } else if (data.found) {
                    showSuccess(data.domain, data.record);
                } else {
                    showNotFound(data.domain);
                }
            } catch (error) {
                showError('Lỗi khi kiểm tra: ' + error.message);
            }
        });

        function showError(message) {
            showResult();
            statusBox.innerHTML = `<div class="status error"><span class="status-icon">✕</span><span>${message}</span></div>`;
            resultContent.innerHTML = '';
        }

        function showSuccess(domain, record) {
            showResult();
            statusBox.innerHTML = `<div class="status success"><span class="status-icon">✓</span><span>Tìm thấy bản ghi DMARC cho ${domain}</span></div>`;
            resultContent.innerHTML = `
                <h3>Bản ghi DMARC</h3>
                <div class="result-box">${escapeHtml(record)}</div>
                <div class="dmarc-details">
                    <h4>Thông tin bản ghi</h4>
                    <p><strong>Tên miền:</strong> ${escapeHtml(domain)}</p>
                    <p><strong>Loại bản ghi:</strong> DNS TXT</p>
                    <p><strong>Tên bản ghi:</strong> _dmarc.${escapeHtml(domain)}</p>
                </div>
            `;
        }

        function showNotFound(domain) {
            showResult();
            statusBox.innerHTML = `<div class="status info"><span class="status-icon">ℹ</span><span>Không tìm thấy bản ghi DMARC cho ${domain}</span></div>`;
            resultContent.innerHTML = `
                <div class="generate-section">
                    <h4>📋 Gợi ý tạo bản ghi DMARC</h4>
                    <p>Tên miền này chưa có bản ghi DMARC. Bạn có thể tham khảo các mẫu sau để cấu hình DNS.</p>

                    <h4 style="margin-top: 16px;">Mẫu cơ bản</h4>
                    <div class="dmarc-example">v=DMARC1; p=none; rua=mailto:admin@${escapeHtml(domain)}</div>

                    <h4>Mẫu cảnh báo và cách ly</h4>
                    <div class="dmarc-example">v=DMARC1; p=quarantine; rua=mailto:admin@${escapeHtml(domain)}; ruf=mailto:admin@${escapeHtml(domain)}; fo=1</div>

                    <h4>Mẫu chặn nghiêm ngặt</h4>
                    <div class="dmarc-example">v=DMARC1; p=reject; rua=mailto:admin@${escapeHtml(domain)}; ruf=mailto:admin@${escapeHtml(domain)}; fo=1</div>

                    <h4>Hướng dẫn cấu hình nhanh</h4>
                    <ol>
                        <li>Đăng nhập vào bảng quản trị DNS của tên miền.</li>
                        <li>Tạo một bản ghi TXT mới.</li>
                        <li>Đặt host hoặc name là <code>_dmarc</code>.</li>
                        <li>Dán một trong các mẫu DMARC ở trên vào giá trị TXT.</li>
                        <li>Lưu thay đổi và chờ DNS cập nhật.</li>
                        <li>Quay lại công cụ này để kiểm tra lại.</li>
                    </ol>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
